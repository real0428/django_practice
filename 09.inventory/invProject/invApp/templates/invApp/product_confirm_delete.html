{% extends "invApp/layout.html" %}
{% block title %}刪除商品{% endblock %}
{% block content %}
  <h1 class="display-6 mb-5">刪除確認</h1>
  <p class="text-center">確定要刪除<strong>{{product.name}}</strong>?</p>
  <form method="POST">
    {% csrf_token %}
    <div class="row justify-content-center">
      <a href="{% url 'product_list' %}" class="btn btn-secondary mx-1">取消</a>
      <button type="submit" class="btn btn-success mx-1">確定</button>
    </div>
  </form>
{% endblock  %}
